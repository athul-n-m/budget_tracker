<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Budget Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f7a5f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--bg:#f5f6f4;--card:#fff;--text:#1d2420;--muted:#6b756f;--line:#e2e6e3;--acc:#0f7a5f;--accbg:#e3f3ee;--inc:#1a8f5a;--exp:#d5473b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121715;--card:#1b221f;--text:#e8eeea;--muted:#8d9a93;--line:#2c3631;--acc:#3ec99f;--accbg:#1d332b;--inc:#4cc58a;--exp:#f0786c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121715;--card:#1b221f;--text:#e8eeea;--muted:#8d9a93;--line:#2c3631;--acc:#3ec99f;--accbg:#1d332b;--inc:#4cc58a;--exp:#f0786c;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:20px;margin:0}
.nw small{color:var(--muted);display:block;font-size:12px}.nw b{font-size:24px}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
nav button{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 14px;border-radius:20px;cursor:pointer;font:inherit}
nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{font-size:16px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,button.b{font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);min-width:0}
button.b{background:var(--acc);color:#fff;border-color:var(--acc);cursor:pointer}
button.g{background:transparent;color:var(--text);border-color:var(--line)}
button.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:16px}
.big{font-size:22px;font-weight:600;margin:4px 0}
.muted{color:var(--muted);font-size:13px}.inc{color:var(--inc)}.exp{color:var(--exp)}
.pill{display:inline-block;background:var(--accbg);color:var(--acc);border-radius:10px;padding:1px 9px;font-size:12px}
.tx{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-top:1px solid var(--line);align-items:center}
.tx:first-of-type{border-top:0}
.bar{height:8px;border-radius:4px;background:var(--exp);opacity:.85}
.tbl{overflow-x:auto}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);max-width:560px;width:calc(100% - 24px);padding:16px}
dialog::backdrop{background:rgba(0,0,0,.45)}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--muted);font-size:11px}
.legend span{display:inline-flex;align-items:center;gap:5px;margin-right:12px;font-size:13px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
@media (max-width:600px){.wrap{padding:12px}form.row>*{flex:1 1 100%!important;width:100%!important}button.b,nav button{min-height:44px}}
</style>
</head>
<body>
<div class="wrap">
<header><h1>💰 Budget Tracker</h1><div class="nw"><small>Total net worth</small><b id="nw"></b></div></header>
<nav id="nav"></nav>
<main id="main"></main>
</div>
<dialog id="dlg"></dialog>
<script>
const TABS=[['acc','Accounts'],['cash','Cash'],['tx','Transactions'],['chart','Spending vs Income'],['inv','Investments']];
const DEF_TAGS=['Restaurants','Barber Shop','Delivery','Grocery','Transport','Bills','Shopping','Health','Entertainment','Salary','Other'];
const INV_TYPES=['Fixed Deposit','Mutual Fund','Stock Market','Gold','PPF / EPF','Crypto','Other'];
const ACC_TYPES=['Savings','Current','Credit Card','Wallet'];
let S={accounts:[],cash:0,tx:[],inv:[],tags:DEF_TAGS.slice()},tab='acc',filter='';
try{const r=localStorage.getItem('bt1');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem('bt1',JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const fmt=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:2}).format(n||0);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date().toLocaleDateString('en-CA');
const accName=id=>id==='cash'?'Cash':(S.accounts.find(a=>a.id===id)||{name:'Deleted account'}).name;
const sumInv=()=>S.inv.reduce((t,i)=>t+i.current,0);

function adjust(id,delta){if(id==='cash')S.cash+=delta;else{const a=S.accounts.find(a=>a.id===id);if(a)a.balance+=delta}}
function txRows(list,showAcc=true){
  if(!list.length)return '<p class="muted">No transactions yet.</p>';
  return list.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(t=>`<div class="tx"><div><span class="pill">${esc(t.tag)}</span> ${esc(t.note)}<div class="muted">${t.date}${showAcc?' · '+esc(accName(t.acc)):''}</div></div><div class="row"><b class="${t.type==='income'?'inc':'exp'}">${t.type==='income'?'+':'−'}${fmt(t.amt)}</b><button class="x" data-act="deltx" data-id="${t.id}" title="Delete">✕</button></div></div>`).join('');
}
function accountCard(a){
  return `<div class="card"><div class="row" style="justify-content:space-between"><b>${esc(a.name)}</b><span class="pill">${esc(a.type)}</span></div>
  <div class="big ${a.balance<0?'exp':''}">${fmt(a.balance)}</div>
  <form data-f="bal" data-id="${a.id}" class="row"><input name="v" type="number" step="0.01" placeholder="New balance" required style="width:130px"><button class="b">Update</button></form>
  <div class="row" style="margin-top:8px"><button class="b g" data-act="detail" data-id="${a.id}">View details</button><button class="x" data-act="delacc" data-id="${a.id}" title="Remove account">🗑</button></div></div>`;
}
function vAcc(){
  const tot=S.accounts.reduce((t,a)=>t+a.balance,0);
  return `<div class="card"><h2>Add a bank account</h2><form data-f="acc" class="row">
  <input name="name" placeholder="Account name (e.g. SBI Savings)" required style="flex:2;min-width:180px">
  <select name="type">${ACC_TYPES.map(t=>`<option>${t}</option>`).join('')}</select>
  <input name="bal" type="number" step="0.01" placeholder="Current balance" required style="flex:1;min-width:120px">
  <button class="b">Add account</button></form></div>
  <p class="muted">${S.accounts.length} account${S.accounts.length===1?'':'s'} · Combined balance <b>${fmt(tot)}</b></p>
  <div class="grid">${S.accounts.map(accountCard).join('')||'<p class="muted">Add your first account above.</p>'}</div>`;
}
function vCash(){
  return `<div class="card"><h2>Cash in hand</h2><div class="big">${fmt(S.cash)}</div>
  <form data-f="cash" class="row"><input name="v" type="number" step="0.01" placeholder="Set cash balance" required><button class="b">Update</button></form></div>
  <div class="card"><h2>Cash transactions</h2>${txRows(S.tx.filter(t=>t.acc==='cash'),false)}</div>`;
}
function vTx(){
  const accs=[['cash','Cash']].concat(S.accounts.map(a=>[a.id,a.name]));
  const list=S.tx.filter(t=>!filter||t.tag===filter);
  return `<div class="card"><h2>Add transaction</h2><form data-f="tx" class="row">
  <select name="type"><option value="expense">Expense</option><option value="income">Income</option></select>
  <input name="amt" type="number" step="0.01" min="0.01" placeholder="Amount" required style="width:110px">
  <select name="tag">${S.tags.map(t=>`<option>${esc(t)}</option>`).join('')}</select>
  <input name="newtag" placeholder="or new tag" style="width:110px">
  <select name="acc">${accs.map(a=>`<option value="${a[0]}">${esc(a[1])}</option>`).join('')}</select>
  <input name="date" type="date" value="${today()}" required>
  <input name="note" placeholder="Note (optional)" style="flex:1;min-width:140px">
  <button class="b">Add</button></form></div>
  <div class="card"><div class="row" style="justify-content:space-between"><h2>History</h2>
  <select data-act="filter"><option value="">All tags</option>${S.tags.map(t=>`<option ${t===filter?'selected':''}>${esc(t)}</option>`).join('')}</select></div>${txRows(list)}</div>`;
}
function vChart(){
  const now=new Date(),ms=[];
  for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);ms.push({k:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'),l:d.toLocaleString('en',{month:'short'}),inc:0,exp:0})}
  S.tx.forEach(t=>{const m=ms.find(m=>m.k===t.date.slice(0,7));if(m)m[t.type==='income'?'inc':'exp']+=t.amt});
  const max=Math.max(1,...ms.map(m=>Math.max(m.inc,m.exp))),H=200,W=600,gw=W/6;
  let svg=`<svg viewBox="0 0 ${W} 240" role="img" aria-label="Monthly income versus spending">`;
  [0,.5,1].forEach(f=>{const y=10+H-H*f;svg+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="2" y="${y-3}">${Math.round(max*f).toLocaleString('en-IN')}</text>`});
  ms.forEach((m,i)=>{const x=i*gw+gw/2,hi=H*m.inc/max,he=H*m.exp/max;
    svg+=`<rect x="${x-26}" y="${10+H-hi}" width="24" height="${hi}" rx="3" fill="var(--inc)"/><rect x="${x+2}" y="${10+H-he}" width="24" height="${he}" rx="3" fill="var(--exp)"/><text x="${x}" y="228" text-anchor="middle">${m.l}</text>`});
  svg+='</svg>';
  const cur=ms[5].k,by={};
  S.tx.filter(t=>t.type==='expense'&&t.date.startsWith(cur)).forEach(t=>by[t.tag]=(by[t.tag]||0)+t.amt);
  const ents=Object.entries(by).sort((a,b)=>b[1]-a[1]),mx=ents.length?ents[0][1]:1;
  const ti=ms.reduce((t,m)=>t+m.inc,0),te=ms.reduce((t,m)=>t+m.exp,0);
  return `<div class="card"><h2>Income vs spending · last 6 months</h2>
  <div class="legend"><span><i style="background:var(--inc)"></i>Income ${fmt(ti)}</span><span><i style="background:var(--exp)"></i>Spending ${fmt(te)}</span><span>Saved <b class="${ti-te<0?'exp':'inc'}">${fmt(ti-te)}</b></span></div>${svg}</div>
  <div class="card"><h2>This month’s spending by tag</h2>${ents.map(([t,v])=>`<div style="margin:8px 0"><div class="row" style="justify-content:space-between"><span>${esc(t)}</span><b>${fmt(v)}</b></div><div class="bar" style="width:${Math.max(3,v/mx*100)}%"></div></div>`).join('')||'<p class="muted">No expenses logged this month.</p>'}</div>`;
}
function vInv(){
  const inv=S.inv.reduce((t,i)=>t+i.invested,0),cur=sumInv(),g=cur-inv;
  return `<div class="card"><h2>Portfolio</h2><div class="row" style="gap:24px"><div><div class="muted">Invested</div><b>${fmt(inv)}</b></div><div><div class="muted">Current value</div><b>${fmt(cur)}</b></div><div><div class="muted">Gain / loss</div><b class="${g<0?'exp':'inc'}">${fmt(g)}${inv?' ('+(g/inv*100).toFixed(1)+'%)':''}</b></div></div></div>
  <div class="card"><h2>Add investment</h2><form data-f="inv" class="row">
  <select name="type">${INV_TYPES.map(t=>`<option>${t}</option>`).join('')}</select>
  <input name="name" placeholder="Name (e.g. HDFC FD, Nifty 50 fund)" required style="flex:2;min-width:180px">
  <input name="invested" type="number" step="0.01" min="0" placeholder="Amount invested" required style="width:140px">
  <input name="current" type="number" step="0.01" min="0" placeholder="Current value" required style="width:130px">
  <button class="b">Add</button></form></div>
  <div class="grid">${S.inv.map(i=>{const g=i.current-i.invested;return `<div class="card"><div class="row" style="justify-content:space-between"><b>${esc(i.name)}</b><span class="pill">${esc(i.type)}</span></div>
  <div class="muted">Invested ${fmt(i.invested)}</div><div class="big">${fmt(i.current)}</div><div class="${g<0?'exp':'inc'}">${g>=0?'▲':'▼'} ${fmt(Math.abs(g))}</div>
  <form data-f="invupd" data-id="${i.id}" class="row" style="margin-top:8px"><input name="v" type="number" step="0.01" placeholder="New value" required style="width:110px"><button class="b">Update</button><button type="button" class="x" data-act="delinv" data-id="${i.id}">🗑</button></form></div>`}).join('')||'<p class="muted">No investments yet.</p>'}</div>`;
}
function render(){
  $('#nav').innerHTML=TABS.map(t=>`<button class="${t[0]===tab?'on':''}" data-act="tab" data-id="${t[0]}">${t[1]}</button>`).join('');
  $('#main').innerHTML={acc:vAcc,cash:vCash,tx:vTx,chart:vChart,inv:vInv}[tab]();
  $('#nw').textContent=fmt(S.accounts.reduce((t,a)=>t+a.balance,0)+S.cash+sumInv());
}
function detail(id){
  const a=S.accounts.find(a=>a.id===id);if(!a)return;
  const list=S.tx.filter(t=>t.acc===id),inc=list.filter(t=>t.type==='income').reduce((t,x)=>t+x.amt,0),exp=list.filter(t=>t.type==='expense').reduce((t,x)=>t+x.amt,0);
  $('#dlg').innerHTML=`<div class="row" style="justify-content:space-between"><h2 style="margin:0">${esc(a.name)}</h2><button class="x" data-act="close">✕</button></div>
  <span class="pill">${esc(a.type)}</span><div class="big">${fmt(a.balance)}</div>
  <div class="row" style="gap:20px"><div><div class="muted">Money in</div><b class="inc">${fmt(inc)}</b></div><div><div class="muted">Money out</div><b class="exp">${fmt(exp)}</b></div><div><div class="muted">Transactions</div><b>${list.length}</b></div></div>
  <h3 style="font-size:15px">Recent activity</h3><div style="max-height:260px;overflow:auto">${txRows(list,false)}</div>`;
  $('#dlg').showModal();
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const id=b.dataset.id,act=b.dataset.act;
  if(act==='tab'){tab=id;render();return}
  if(act==='detail'){detail(id);return}
  if(act==='close'){$('#dlg').close();return}
  if(act==='filter')return;
  if(act==='delacc'&&confirm('Remove this account? Its transactions stay in history.'))S.accounts=S.accounts.filter(a=>a.id!==id);
  else if(act==='delinv'&&confirm('Remove this investment?'))S.inv=S.inv.filter(i=>i.id!==id);
  else if(act==='deltx'){const t=S.tx.find(t=>t.id===id);if(t){adjust(t.acc,t.type==='income'?-t.amt:t.amt);S.tx=S.tx.filter(x=>x.id!==id)}}
  else return;
  save();render();
});
document.addEventListener('change',e=>{if(e.target.dataset.act==='filter'){filter=e.target.value;render()}});
$('#dlg').addEventListener('click',e=>{if(e.target.id==='dlg')e.target.close()});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target,k=f.dataset.f,d=Object.fromEntries(new FormData(f)),id=f.dataset.id;
  if(k==='acc')S.accounts.push({id:uid(),name:d.name.trim(),type:d.type,balance:+d.bal});
  else if(k==='bal')S.accounts.find(a=>a.id===id).balance=+d.v;
  else if(k==='cash')S.cash=+d.v;
  else if(k==='inv')S.inv.push({id:uid(),type:d.type,name:d.name.trim(),invested:+d.invested,current:+d.current});
  else if(k==='invupd')S.inv.find(i=>i.id===id).current=+d.v;
  else if(k==='tx'){
    let tag=d.newtag.trim()||d.tag;if(!S.tags.includes(tag))S.tags.push(tag);
    S.tx.push({id:uid(),type:d.type,amt:+d.amt,tag,acc:d.acc,date:d.date,note:d.note.trim()});
    adjust(d.acc,d.type==='income'?+d.amt:-d.amt);
  }
  save();render();
});
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
</body>
</html>
